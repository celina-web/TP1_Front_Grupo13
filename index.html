<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WebFest 2026</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Permanent+Marker&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- NAVBAR -->
    <header class="navbar">

        <div class="logo">
            WEB<br>FEST
        </div>

        <nav>
            <a href="#" class="active">INICIO</a>
            <a href="#artistas">PERFILES</a>
            <a href="#">GALERÍA</a>
            <a href="#">CONTACTO</a>
        </nav>

        <div class="year">
            2026
        </div>

    </header>


    <!-- HERO -->
    <main class="hero">

        <div class="decor decor-pink"></div>
        <div class="decor decor-green"></div>
        <div class="lightning">ϟ</div>

        <section class="hero-content">

            <h1>LINE UP</h1>

            <p class="subtitle">
                4 ARTISTAS <span>•</span> 4 HISTORIAS <span>•</span> UN MISMO FESTIVAL
            </p>

            <!-- ARTISTAS -->
            <section class="artists" id="artistas">

                <article class="artist-card green">

                    <div class="artist-image">
                        <img src="img/sebas.jpg" alt="Sebas">
                    </div>

                    <div class="artist-info">
                        <h2>SEBAS</h2>
                        <span>#01</span>
                    </div>

                </article>


                <article class="artist-card pink">

                    <div class="artist-image">
                        <img src="img/martina.jpg" alt="Martina">
                    </div>

                    <div class="artist-info">
                        <h2>VALEN</h2>
                        <span>#02</span>
                    </div>

                </article>


                <article class="artist-card orange">

                    <div class="artist-image">
                        <img src="img/lucas.jpg" alt="Lucas">
                    </div>

                    <div class="artist-info">
                        <h2>AGUS</h2>
                        <span>#03</span>
                    </div>

                </article>


                <article class="artist-card yellow">

                    <div class="artist-image">
                        <img src="img/sofi.jpg" alt="Sofi">
                    </div>

                    <div class="artist-info">
                        <h2>CELI</h2>
                        <span>#04</span>
                    </div>

                </article>

            </section>


            <button class="explore">
                EXPLORAR LINE UP
            </button>

        </section>

    </main>


    <!-- DECORACIÓN INFERIOR -->
    <footer class="crowd">
        <div class="person"></div>
        <div class="person"></div>
        <div class="person"></div>
        <div class="person"></div>
        <div class="person"></div>
        <div class="person"></div>
        <div class="person"></div>
        <div class="person"></div>
    </footer>

</body>
</html>
